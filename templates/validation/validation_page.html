<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - CrediMate</title>
    <meta name="description" content="Complete your KYC verification with our secure document upload system">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/validation/validation_page.css') }}">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SecureBank Logo">
            </div>
            <div class="nav-right">
                <!-- Notification Button -->
                <button class="notification-btn" onclick="toggleNotifications()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-badge">3</span>
                </button>

                <!-- Profile Dropdown -->
                <div class="dropdown">
                    <button class="profile-btn" onclick="toggleDropdown()">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>{{ user.first_name }} {{ user.last_name }}</span>

                        <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <polyline points="6,9 12,15 18,9"></polyline>
                        </svg>
                    </button>
                    <div class="dropdown-menu" id="profileDropdown">
                        <button class="dropdown-item">
                            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                            Settings
                        </button>
                        <button onclick="window.location.href='/logout'" class="dropdown-item danger">
                            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16,17 21,12 16,7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Notification Sidebar -->
    <div class="notification-overlay" id="notificationOverlay" onclick="closeNotifications()"></div>
    <div class="notification-sidebar" id="notificationSidebar">
        <div class="notification-header">
            <h2>Notifications</h2>
            <button class="close-btn" onclick="closeNotifications()">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="notifications-list"></div>

    </div>

    <!-- Main Content -->
     
     <div id="processContainer">
        <h3> Validation Checklist</h3>
        <div class="process" id="step1"><span class="process-title">Validating file integrity...</span> <span class="tick">✔</span></div>
        <div class="process" id="step2"><span class="process-title">Validating Aadhar card...</span> <span class="tick">✔</span></div>
        <!-- <div class="otp-section" id="otpAadhar">
        Enter OTP for Aadhar: <input type="text" id="otpAadharInput" maxlength="6"><button onclick="verifyOTP('Aadhar')">Verify</button>
        </div> -->

        <div class="process" id="step3"><span class="process-title">Validating PAN card...</span> <span class="tick">✔</span></div>
        <!-- <div class="otp-section" id="otpPan">
        Enter OTP for PAN: <input type="text" id="otpPanInput" maxlength="6"><button onclick="verifyOTP('PAN')">Verify</button>
        </div> -->

        <div class="process" id="step4"><span class="process-title">KYC Verified</span> <span class="tick">✔</span></div>
        <div class="process" id="step5"><span class="process-title">Reading uploaded documents...</span> <span class="tick">✔</span></div>
        <div class="process" id="step6"><span class="process-title">Analyzing documents...</span> <span class="tick">✔</span></div>
        <div class="process" id="step7"><span class="process-title">Final evaluation...</span> <span class="tick">✔</span></div>
        <div class="process" id="step8"><span class="process-title">Generating report...</span> <span class="tick">✔</span></div>
        <div class="process" id="step9"><span class="process-title">Process completed!</span> <span class="tick">✔</span></div>

        <button id="showReportBtn" class="btn">Show Report</button>

    </div>
    <br><br>
    <script>
    document.getElementById("showReportBtn").addEventListener("click", function () {
        window.location.href = "/report";  // Make sure this matches your Flask route
        });
    </script>

    <script src="{{ url_for('static', filename='js/validation/validation_page.js') }}"></script>
</body>
</html>
